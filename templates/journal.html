<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Journal Learning PWA</title>

  <!-- PWA -->
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#111827">

  <!-- CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <div id="navbar"></div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Hi, I am Nishal</h1>
      <p>Welcome to my Learning Journal PWA for Mobile Application Development.</p>
      <p><strong>Here I will document each week and show my projects.</strong></p>
      <p id="dateDisplay"></p>
    </section>

    <!-- Form to add a new journal entry -->
    <section class="journal-form">
      <h2>Add a new journal entry</h2>
      <form id="journalForm">
        <label for="journalText">Your reflection:</label>
        <textarea id="journalText" rows="4" placeholder="Write your reflection..." required></textarea>

        <label for="journalMood">Mood:</label>
        <select id="journalMood" required>
          <option value="">-- Select Mood --</option>
          <option value="Happy">😊 Happy</option>
          <option value="Neutral">😐 Neutral</option>
          <option value="Sad">😢 Sad</option>
          <option value="Excited">🤩 Excited</option>
          <option value="Frustrated">😤 Frustrated</option>
        </select>

        <button type="submit" class="btn">Save Entry</button>
      </form>
    </section>

    <!-- JSON-based journal entries -->
    <section class="journal-entries-json">
      <h2>Reflections</h2>

      <button id="exportJsonBtn" class="btn">Download reflections.json</button>

      <!-- Entries will render here -->
      <div id="jsonEntries"></div>
      <p id="entryCount"></p>
    </section>
  </main>
<div id="offlineOverlay" class="offline-overlay hidden">
  <p> You are offline</p>
</div>
  <footer>
    <p>@ 2025 Nishal Chaudhary • Learning journal PWA.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
